  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Notebook" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Google Fonts for Retro Flip Clock -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <title>Notebook - Smart AI Learning Assistant</title>

  <meta name="description"
    content="Master any subject with Nova, your Hybrid AI study partner. Create flashcards, notes, and exams in seconds using Groq and Gemini speed." />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Notebook - Smart AI Learning Assistant" />
  <meta property="og:description"
    content="Flashcards, notes, and exams powered by Hybrid AI. Revolutionize your study routine with Nova." />
  <meta property="og:image" content="/pwa-512.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Notebook AI" />

    content="The ultimate AI-powered study tool. Speed of Groq, reliability of Gemini." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    async function registerPeriodicSync(registration) {
      try {
        // Check if periodicSync is supported (already checked in caller but good for safety)
        if (!('periodicSync' in registration)) return;

        // Query permission
        const status = await navigator.permissions.query({
          name: 'periodic-background-sync',
        });

        if (status.state === 'granted') {
          await registration.periodicSync.register('content-sync', {
            minInterval: 24 * 60 * 60 * 1000, // 1 day
          });
          console.log('Periodic background sync registered: content-sync');
        } else {
          console.info('Periodic background sync permission not granted yet. Usually requires app installation.');
        }
      } catch (error) {
        console.error('Periodic background sync registration failed:', error);
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(registration => {
            console.log('SW registered: ', registration);

            // Check for Background Sync
            if ('sync' in registration) {
              console.log('Background Sync supported');
            }

            // Check for Periodic Sync
            if ('periodicSync' in registration) {
              console.log('Periodic Sync supported');
              registerPeriodicSync(registration);
            }

            // Check for Push
            if ('pushManager' in registration) {
              console.log('Push Notifications supported');
            }
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>

</html>
